# Variable substitution uses a repo-root .env file (copy from .env.example).
# Docker Compose loads .env automatically for ${VAR} placeholders.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: queryplus-sqlserver
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      # Loopback-only: this exposes the SA account, not meant to be reachable off-host.
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: queryplus-keycloak
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_HTTP_PORT: 8080
      # Browser URLs must use localhost (published port), not the Docker service name.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      # Exposes the Quarkus management interface (port 9000, container-internal only)
      # that the healthcheck below polls - the image ships without curl/wget, so a plain
      # /dev/tcp request is the lightest check that doesn't require installing anything.
      KC_HEALTH_ENABLED: "true"
    ports:
      # Loopback-only: this exposes the Keycloak admin console, not meant to be reachable
      # off-host.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queryplus-api
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=QueryPlus;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Keycloak__Authority: "http://localhost:8080/realms/queryplus"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/queryplus/.well-known/openid-configuration"
      Keycloak__BackchannelHost: "keycloak"
      Keycloak__BackchannelPort: "8080"
      Keycloak__ClientId: "${Keycloak__ClientId:-queryplus-web}"
      Keycloak__ClientSecret: "${Keycloak__ClientSecret}"
      Keycloak__RequireHttpsMetadata: "false"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles:
      - full

volumes:
  sqlserver_data:
