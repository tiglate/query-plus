allowBuilds:
  esbuild: true

# nanoid <3.3.17 has a known indefinite-loop DoS (GHSA-2v37-7h3g-55p8). It's a transitive
# dev-only dependency (via postcss, several levels deep through vite/vitest/tailwind) that
# never ships to the browser bundle, but pin it forward anyway rather than waiting for every
# intermediate package to bump its own postcss dependency.
overrides:
  nanoid: ^3.3.17
